<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>āPO — Handpicked Seafood</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #AF9500; --brand-blue: #1A4F8B; --dark-bg: #0D2342; --card-bg: #122C52; --champagne: #E2D1C3; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { background: var(--dark-bg); color: var(--champagne); font-family: "Montserrat", "Sarabun", sans-serif; -webkit-font-smoothing: antialiased; width: 100%; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
        .luxury-header { background: #0D2342; border-bottom: 1px solid rgba(175, 149, 0, 0.15); padding-bottom: 5px; position: relative; }
        .brand-logo-container { padding: 30px 20px 15px; text-align: center; }
        .brand-logo-container img { width: 75px; height: auto; border-radius: 50%; border: 1px solid rgba(175, 149, 0, 0.2); }
        .luxury-tabs { display: flex; max-width: 450px; margin: 0 auto; gap: 40px; padding: 0 20px; }
        .tab { flex: 1; text-align: center; padding: 12px 0; font-size: 13px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: 0.3s; color: rgba(226, 209, 195, 0.35); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); font-weight: 600; }
        .container { max-width: 500px; margin: 0 auto; padding: 25px 16px; position: relative; }
        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; }
        .luxury-card { background: var(--card-bg); border-radius: 4px; margin-bottom: 35px; border: 1px solid rgba(175, 149, 0, 0.12); box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; }
        .card-visual { height: 320px; background-size: cover; background-position: center; position: relative; border-radius: 4px 4px 0 0; }
        .card-visual::after { content:""; position:absolute; bottom:0; left:0; width:100%; height:50%; background: linear-gradient(to bottom, transparent, var(--card-bg)); }
        .luxury-badge { position: absolute; top: 16px; right: 16px; z-index: 2; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 12px; border-radius: 2px; }
        .luxury-badge.available { background: var(--gold); color: #000; }
        .luxury-badge.reserved { background: transparent; border: 1px solid var(--champagne); color: var(--champagne); opacity: 0.7; }
        .card-content { padding: 20px 20px 25px; position: relative; margin-top: -25px; z-index: 3; }
        .item-code { font-size: 12px; color: var(--gold); letter-spacing: 2px; display: block; margin-bottom: 6px; font-weight: 600; }
        .card-content h2 { font-family: "Playfair Display", "Sarabun", serif; font-size: 26px; font-weight: 500; color: #fff; line-height: 1.3; margin-bottom: 20px; }
        .specs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; border-top: 1px solid rgba(175, 149, 0, 0.15); border-bottom: 1px solid rgba(175, 149, 0, 0.15); padding: 18px 0; margin-bottom: 22px; }
        .spec-item label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 4px; font-weight: 500; opacity: 0.8; }
        .spec-item span { font-size: 16px; color: #fff; }
        .price-main span { font-size: 21px; color: var(--gold); font-weight: 600; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .harvest-date { font-size: 12px; opacity: 0.5; font-style: italic; }
        .btn-luxury { background: var(--gold); color: #000; border: none; padding: 14px 24px; font-family: "Montserrat", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.2s; border-radius: 3px; min-width: 130px; text-align: center; }
        .btn-luxury:active { transform: scale(0.97); }
        .btn-luxury.disabled { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.2); cursor: not-allowed; }
        .empty-state { text-align: center; padding: 60px 20px; border: 1px dashed rgba(175, 149, 0, 0.15); }
        .footer { text-align: center; padding: 40px 20px 60px; font-size: 10px; letter-spacing: 2px; opacity: 0.35; text-transform: uppercase; border-top: 1px solid rgba(175, 149, 0, 0.1); }
        .loading { text-align: center; padding: 100px 20px; font-size: 14px; letter-spacing: 2px; color: var(--gold); }
    </style>
</head>
<body>
    <div class="luxury-header">
        <div class="brand-logo-container">
            <img src="https://pub-0ae76ea92a9d4cec8f2d5aace411ab7a.r2.dev/D3D0031F-0375-4B40-BD5F-E95052107138.png" alt="āPO Logo">
        </div>
        <div class="luxury-tabs">
            <div class="tab active" onclick="switchTab('fish')" id="tab-fish">The Fish</div>
            <div class="tab" onclick="switchTab('shell')" id="tab-shell">Shell & Sea</div>
        </div>
    </div>

    <div class="container">
        <div id="loading-state" class="loading">LOADING SELECTION...</div>
        <div class="tab-content active" id="content-fish"></div>
        <div class="tab-content" id="content-shell"></div>
    </div>

    <div class="footer" id="page-footer">Experience āPO</div>

    <script>
        let allStocks = [];
        const API_URL = "---API_URL_PLACEHOLDER---";

        async function fetchStocks() {
            try {
                const res = await fetch(API_URL);
                allStocks = await res.json();
                document.getElementById('loading-state').style.display = 'none';
                renderAll();
            } catch (err) {
                document.getElementById('loading-state').innerText = "FAILED TO LOAD STOCKS. PLEASE REFRESH.";
            }
        }

        function switchTab(t) {
            document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
            document.getElementById("tab-"+t).classList.add("active");
            document.getElementById("content-"+t).classList.add("active");
        }

        function buildCards(list) {
            if (list.length === 0) {
                return '<div class="empty-state"><h3>Currently Unavailable</h3><p>Our daily selection is being replenished. Please check back shortly.</p></div>';
            }
            return list.map(s => {
                const isReserved = s.status === "จองแล้ว";
                const badge = isReserved ? '<div class="luxury-badge reserved">Reserved</div>' : '<div class="luxury-badge available">Available</div>';
                
                let totalVal = s.total;
                if (!isNaN(parseFloat(s.weight)) && !isNaN(parseFloat(s.priceKg)) && !s.total) {
                    totalVal = (parseFloat(s.weight) * parseFloat(s.priceKg)).toLocaleString();
                }

                const rawMsg = `สนใจสั่งซื้อ ${s.name} รหัส ${s.code} — ${s.weight} กก. — ราคารวม ${totalVal} ฿`;
                const safeEncodedMsg = encodeURIComponent(rawMsg).replace(/'/g, "%27").replace(/"/g, "%22");
                const imgStyle = s.image ? `background-image: url('${s.image}');` : 'background-color: #122C52;';

                return `<div class="luxury-card ${isReserved ? 'is-reserved' : ''}">
                    <div class="card-visual" style="${imgStyle}">${badge}</div>
                    <div class="card-content">
                        <div class="card-header">
                            <span class="item-code">${s.code}</span>
                            <h2>${s.name}</h2>
                        </div>
                        <div class="specs-grid">
                            <div class="spec-item"><label>Weight</label><span>${s.weight} kg</span></div>
                            <div class="spec-item"><label>Origin</label><span>${s.source}</span></div>
                            <div class="spec-item"><label>Price / kg</label><span>${parseFloat(s.priceKg).toLocaleString()} ฿</span></div>
                            <div class="spec-item price-main"><label>Total Amount</label><span>${totalVal} ฿</span></div>
                        </div>
                        <div class="card-footer">
                            <span class="harvest-date">Captured: ${s.date}</span>
                            ${isReserved ? '<button class="btn-luxury disabled" disabled>RESERVED</button>' : `<button class="btn-luxury" onclick="handleOrder('${safeEncodedMsg}')">ORDER NOW</button>`}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderAll() {
            const fish = allStocks.filter(s => s.category === "ปลา");
            const shell = allStocks.filter(s => s.category === "หอย/ทะเล");
            document.getElementById('content-fish').innerHTML = buildCards(fish);
            document.getElementById('content-shell').innerHTML = buildCards(shell);
            
            const today = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('page-footer').innerText = `Selected for ${today} — Experience āPO`;
        }

        function handleOrder(encodedMsg) {
            window.open("https://line.me/R/oaMessage/@885iivsu/?" + encodedMsg, "_blank");
        }

        fetchStocks();
    </script>
</body>
</html>
