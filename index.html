<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>āPO — Handpicked Seafood</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #AF9500; --dark-bg: #0D2342; --card-bg: #122C52; --champagne: #E2D1C3; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { background: var(--dark-bg); color: var(--champagne); font-family: "Montserrat", "Sarabun", sans-serif; }
        .header { padding: 40px 20px 20px; text-align: center; }
        .logo { width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; margin-bottom: 10px; }
        .container { max-width: 500px; margin: 0 auto; padding: 0 16px 40px; }
        .luxury-card { background: var(--card-bg); border-radius: 4px; margin-bottom: 35px; border: 1px solid rgba(175, 149, 0, 0.2); }
        .card-visual { height: 280px; background-size: cover; background-position: center; border-radius: 4px 4px 0 0; background-color: #0D2342; }
        .card-content { padding: 20px; }
        .item-code { font-size: 11px; color: var(--gold); letter-spacing: 2px; font-weight: 600; }
        h2 { font-family: "Playfair Display", serif; font-size: 24px; color: #fff; margin: 5px 0 15px; }
        .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; font-size: 13px; }
        .spec-item label { display: block; color: var(--gold); font-size: 9px; text-transform: uppercase; }
        .price-main { font-size: 18px; color: var(--gold); font-weight: 600; }
        .btn-luxury { background: var(--gold); color: #000; border: none; padding: 12px; width: 100%; font-weight: 600; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://pub-0ae76ea92a9d4cec8f2d5aace411ab7a.r2.dev/D3D0031F-0375-4B40-BD5F-E95052107138.png" class="logo" alt="āPO Logo">
    </div>
    <div class="container" id="app">
        <div id="loading" style="text-align:center; color:var(--gold);">LOADING...</div>
        <div id="content"></div>
    </div>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwWBH-Bcvh8W6LNLbLMIkQxizQsAG6yNYnTUeoHV6aRIPT8VFa_N6AdQuDQCqtumsGxTA/exec";
        async function fetchStocks() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = data.map(s => {
                    const msg = encodeURIComponent(`สนใจสั่งซื้อ ${s.name} รหัส ${s.code}`);
                    return `<div class="luxury-card">
                        <div class="card-visual" style="background-image: url('${s.image || ''}')"></div>
                        <div class="card-content">
                            <span class="item-code">${s.code}</span>
                            <h2>${s.name}</h2>
                            <div class="specs-grid">
                                <div><label>Weight</label>${s.weight} kg</div>
                                <div><label>Origin</label>${s.source}</div>
                                <div><label>Price/kg</label>${parseInt(s.priceKg).toLocaleString()} ฿</div>
                                <div class="price-main"><label>Total</label>${(s.weight * s.priceKg).toLocaleString()} ฿</div>
                            </div>
                            <button class="btn-luxury" onclick="window.open('https://line.me/R/oaMessage/@885iivsu/?${msg}')">ORDER NOW</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { document.getElementById('loading').innerText = "ERROR"; }
        }
        fetchStocks();
    </script>
</body>
</html>
