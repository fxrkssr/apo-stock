<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>āPO — Handpicked Seafood</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --gold: #AF9500; --dark-blue: #0D2342; --card-navy: #122C52; --champagne: #E2D1C3; --white: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark-blue); color: var(--champagne); font-family: 'Montserrat', sans-serif; padding-bottom: 50px; }
        
        .header { padding: 40px 20px; text-align: center; }
        
        /* โลโก้แบบกลมกลืนกับพื้นหลัง */
        .logo-container {
    width: 100%;
    max-width: 350px; 
    margin: 0 auto 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #0D2342;
    border-radius: 50%;
    overflow: hidden;
}
        .logo-img { width: 100%; height: auto; object-fit: contain; opacity: 0.9; }

        /* แท็บเมนู */
        .tabs-container { display: flex; justify-content: center; gap: 40px; margin-bottom: 30px; border-bottom: 1px solid rgba(175, 149, 0, 0.2); padding-bottom: 12px; }
        .tab-trigger { color: rgba(226, 209, 195, 0.4); cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 3px; font-weight: 600; position: relative; }
        .tab-trigger.active { color: var(--gold); }
        .tab-trigger.active::after { content: ''; position: absolute; bottom: -13px; left: 0; width: 100%; height: 2px; background: var(--gold); }

        .container { max-width: 500px; margin: 0 auto; padding: 0 16px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        
        /* การ์ดสินค้า */
        .product-card { background: var(--card-navy); border: 1px solid rgba(175, 149, 0, 0.15); border-radius: 2px; margin-bottom: 30px; overflow: hidden; }
        .product-image { height: 280px; background-size: cover; background-position: center; }
        .product-info { padding: 25px; }
        h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--white); margin: 10px 0 20px; }
        
        /* สเปคสินค้า */
        .specs-grid { display: grid; gap: 12px; margin-bottom: 25px; border-top: 1px solid rgba(226, 209, 195, 0.1); padding-top: 15px; }
        .spec-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .spec-label { color: var(--gold); font-size: 10px; text-transform: uppercase; font-weight: 600; }
        .price-highlight { color: var(--gold); font-weight: 700; font-size: 18px; }
        
        .order-btn { background: var(--gold); color: #000; border: none; padding: 15px; width: 100%; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <img src="https://pub-0ae76ea92a9d4cec8f2d5aace411ab7a.r2.dev/logo%20apo.png" class="logo-img" alt="āPO Logo">
        </div>
        <nav class="tabs-container">
            <div class="tab-trigger active" onclick="switchTab('fish', this)">The Fish</div>
            <div class="tab-trigger" onclick="switchTab('shell', this)">Shell & Sea</div>
        </nav>
    </header>

    <div class="container">
        <div id="panel-fish" class="tab-panel active"></div>
        <div id="panel-shell" class="tab-panel"></div>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbwWBH-Bcvh8W6LNLbLMIkQxizQsAG6yNYnTUeoHV6aRIPT8VFa_N6AdQuDQCqtumsGxTA/exec";
        function switchTab(target, btn) {
            document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panel-' + target).classList.add('active');
        }
        async function loadData() {
            const res = await fetch(API);
            const items = await res.json();
            document.getElementById('panel-fish').innerHTML = render(items.filter(i => i.category === "ปลา"));
            document.getElementById('panel-shell').innerHTML = render(items.filter(i => i.category === "หอย/ทะเล"));
        }
        function render(data) {
            return data.map(item => `
                <article class="product-card">
                    <div class="product-image" style="background-image: url('${item.image}')"></div>
                    <div class="product-info">
                        <small style="color:var(--gold)">${item.code}</small>
                        <h2>${item.name}</h2>
                        <div class="specs-grid">
                            <div class="spec-row"><span class="spec-label">Weight</span><span>${item.weight} kg</span></div>
                            <div class="spec-row"><span class="spec-label">Origin</span><span>${item.source}</span></div>
                            <div class="spec-row"><span class="spec-label">Price / kg</span><span>${parseInt(item.priceKg).toLocaleString()} ฿</span></div>
                            <div class="spec-row"><span class="spec-label">Total Amount</span><span class="price-highlight">${(item.weight * item.priceKg).toLocaleString()} ฿</span></div>
                        </div>
                        <button class="order-btn" onclick="window.open('https://line.me/R/oaMessage/@885iivsu/?สนใจสั่งซื้อ ${item.name} รหัส ${item.code}')">Order Now</button>
                    </div>
                </article>`).join('');
        }
        loadData();
    </script>
</body>
</html>
